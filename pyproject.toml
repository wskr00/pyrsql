[project]
name = "pyrsql"
version = "0.0.1"
description = "ORM-oriented RSQL support for Python applications."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["rsql", "orm", "sqlalchemy", "fastapi", "query-language", "rest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
    "Topic :: Database",
]
dependencies = [
    "ciso8601>=2.3,<3.0",
    "msgspec>=0.18,<1.0",
    "typing-extensions>=4.10.0; python_version < '3.11'",
]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0,<3.0"]
fastapi = ["fastapi>=0.110,<1.0"]

[project.urls]
Homepage = "https://github.com/wskr00/pyrsql"
Repository = "https://github.com/wskr00/pyrsql"
Issues = "https://github.com/wskr00/pyrsql/issues"
Documentation = "https://github.com/wskr00/pyrsql/blob/main/README.md"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typing" },
]
lint = ["ruff>=0.11.0", "pylint>=3.2.0"]
test = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
]
typing = ["mypy>=1.10.0"]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
managed = true

[tool.ruff]
line-length = 80
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "PT"]
ignore = ["E501"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["pyrsql"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402", "S101"]
"src/pyrsql/integrations/fastapi/*.py" = ["B008"]
"tests/functional/fastapi_sqlalchemy/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]
markers = [
    "unit: isolated tests",
    "integration: interaction between components",
    "functional: user-visible behavior",
    "performance: benchmark tests",
    "sqlalchemy: SQLAlchemy tests",
    "fastapi: FastAPI tests",
]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
show_error_codes = true

[tool.coverage.run]
source = ["pyrsql"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.uv.build-backend]
source-include = [
    "docs/**",
    "tests/**",
    "src/pyrsql/py.typed",
    ".pylintrc"
]