[project]
name = "pyrsql"
version = "0.1.0"
description = "ORM-oriented RSQL support for Python applications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
sqlalchemy = [
    "sqlalchemy>=2.0,<3.0",
]

[dependency-groups]
dev = [
    {include-group = "format"},
    {include-group = "lint"},
    {include-group = "test"},
    {include-group = "typing"},
]
format = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "ruff>=0.11.0",
]
lint = [
    "pylint>=3.2.0",
]
test = [
    "pytest>=8.2.0",
]
typing = [
    "mypy>=1.10.0",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.black]
line-length = 80
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 80
src_paths = ["src", "tests"]

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]
ignore = [
    "E501",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]
markers = [
    "unit: isolated tests for one module or class",
    "integration: tests that validate interaction between components",
    "functional: tests that validate user-visible library behavior",
    "performance: performance and benchmark-oriented regression tests",
    "sqlalchemy: tests that exercise the SQLAlchemy ORM",
]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unused_configs = true
show_error_codes = true

[tool.uv.build-backend]
source-include = [
    "docs/**",
    "tests/**",
    "pylintrc",
]
