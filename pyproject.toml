[project]
name = "pyrsql"
version = "0.0.4"
description = "Compiler-oriented RSQL query engine for safe, typed, and extensible Python ORM-backed APIs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["rsql", "orm", "filter", "pagination", "sort", "sqlalchemy", "fastapi", "rest"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading",
    "Framework :: FastAPI",
    "Topic :: Database",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "msgspec>=0.18,<1.0",
    "typing-extensions>=4.10.0; python_version < '3.11'",
]

[project.optional-dependencies]
sqlalchemy = ["sqlalchemy>=2.0,<3.0"]
fastapi = ["fastapi>=0.110,<1.0"]

[project.urls]
Homepage = "https://github.com/wskr00/pyrsql"
Repository = "https://github.com/wskr00/pyrsql"
Issues = "https://github.com/wskr00/pyrsql/issues"
Documentation = "https://wskr00.github.io/pyrsql/"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typing" },
    { include-group = "docs" },
]
lint = [
    "ruff>=0.11.0",
]
test = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
]
typing = ["mypy>=2.0.0"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
managed = true

[tool.ruff]
line-length = 80
target-version = "py310"
src = ["src", "tests"]
fix = true

[tool.ruff.lint]
select = ["ALL"]
preview = true
fixable = ["ALL"]
unfixable = ["ERA"]

ignore = [
    "CPY001",
    "EM101",
    "EM102",
    "TRY003",
    "COM812",
    "ISC001",
    "C901",
    "PLR0913",
    "PLR0911",
    "PLR0912"
]

future-annotations = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true
suppress-dummy-args = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["typing", "typing_extensions"]
strict = false
runtime-evaluated-base-classes = [
    "sqlalchemy.orm.DeclarativeBase",
]
runtime-evaluated-decorators = [
    "fastapi.FastAPI.get",
    "fastapi.FastAPI.post",
    "fastapi.FastAPI.put",
    "fastapi.FastAPI.patch",
    "fastapi.FastAPI.delete",
    "fastapi.FastAPI.options",
    "fastapi.FastAPI.head",
    "fastapi.FastAPI.trace",
    "fastapi.FastAPI.api_route",
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.APIRouter.patch",
    "fastapi.APIRouter.delete",
    "fastapi.APIRouter.options",
    "fastapi.APIRouter.head",
    "fastapi.APIRouter.trace",
    "fastapi.APIRouter.api_route",
]

[tool.ruff.lint.isort]
known-first-party = ["pyrsql"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",
    "ARG",
    "B008",
    "DOC201",
    "DOC501",
    "DOC502",
    "D",
    "E402",
    "FBT",
    "PLR2004",
    "S101",
    "SLF001",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "--import-mode=importlib",
]
markers = [
    "unit: isolated tests",
    "integration: interaction between components",
    "functional: user-visible behavior",
    "security: adversarial safety and injection-resistance tests",
    "performance: benchmark tests",
    "sqlalchemy: SQLAlchemy tests",
    "fastapi: FastAPI tests",
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
exclude = ["^tests/"]
strict = true
warn_unused_configs = true
show_error_codes = true
pretty = true

[tool.coverage.run]
source = ["pyrsql"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.uv.build-backend]
source-include = [
    "docs/**",
    "tests/**",
    "src/pyrsql/py.typed",
]
